name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # On Linux this runs the real /proc parser tests against a synthetic
      # procfs tree; on Windows it exercises the cfg-guarded shim + fixtures.
      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

      # Guard the "not implemented" eBPF stub compiles under its feature flag.
      - name: Build with ebpf feature (stub only)
        run: cargo build -p kernelkite-cli --features ebpf

  viewer:
    name: typescript viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install deps
        working-directory: viewer
        run: npm ci || npm install

      - name: Typecheck + build
        working-directory: viewer
        run: npm run build

      - name: Test
        working-directory: viewer
        run: npm test

  samples:
    name: reproduce samples (linux)
    runs-on: ubuntu-latest
    needs: [rust, viewer]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Build workspace
        run: cargo build --release

      - name: Build viewer
        working-directory: viewer
        run: |
          npm ci || npm install
          npm run build

      - name: Regenerate samples and fail on drift
        run: |
          make samples
          git diff --exit-code -- samples \
            || (echo "::error::samples/ drifted; run 'make samples' and commit" && exit 1)
